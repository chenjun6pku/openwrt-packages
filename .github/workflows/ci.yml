name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read feed build version
        id: feed
        run: echo "build_version=$(python3 scripts/feed_meta.py get build_version)" >> "$GITHUB_OUTPUT"

      - name: Detect changed packages
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          force_all=0
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            force_all=1
          elif git diff --name-only "$BASE_SHA"...HEAD -- \
              .github/workflows/ci.yml \
              .github/scripts/changed-packages.sh \
              scripts/feed_meta.py \
              scripts/feed_state.py \
              scripts/list-packages.sh \
              feed.json \
              vendor | grep -q .; then
            force_all=1
          fi

          if [ "$force_all" -eq 1 ]; then
            list="$(./scripts/list-packages.sh | tr '\n' ' ')"
          else
            list="$(./.github/scripts/changed-packages.sh "$BASE_SHA" HEAD | tr '\n' ' ')"
          fi

          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ -n "$list" ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.changed.outputs.has == '1'
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: x86_64-${{ steps.feed.outputs.build_version }}
          FEEDNAME: custom
          PACKAGES: ${{ steps.changed.outputs.list }}
          INDEX: "0"
          NO_REFRESH_CHECK: "true"

      - name: Upload build artifacts
        if: always() && steps.changed.outputs.has == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_id }}
          path: |
            bin/packages/x86_64/custom
            logs
          if-no-files-found: warn
          retention-days: 7
