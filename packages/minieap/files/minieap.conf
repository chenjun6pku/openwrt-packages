# MiniEAP configuration
# This file is sourced by /etc/init.d/minieap.
# Do not use shell special characters in values.

username=example
password=changeme

# Interface used for 802.1X authentication, e.g. eth0, eth0.2, wan
nic=eth0

# Packet plugin(s), in order.
# For Ruijie authentication use: rjv3
# Multiple modules can be space-separated, e.g. "printer rjv3 printer"
module=rjv3

# Optional interface backend: sockraw (default) or libpcap
#if_impl=sockraw
